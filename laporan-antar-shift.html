<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>Laporan Antar Shift — Readiness Supply Core Making</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Hanken Grotesk', sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
    padding: 24px 12px;
}
#lapReport { margin: 0 auto; background: #fff; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }
.kop { display: flex; align-items: stretch; border-bottom: 2px solid #111; }
.kop-left { flex: 25; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.6; border-right: 1px solid #d1d5db; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.kop-center { flex: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 12px; border-right: 1px solid #d1d5db; }
.kop-center .t1 { font-size: 28px; font-weight: 800; letter-spacing: .02em; }
.kop-center .t2 { font-size: 19px; font-weight: 800; margin-top: 5px; }
.kop-right { flex: 25; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 9px; justify-content: center; }
.kop-rrow { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.kop-rlab { min-width: 64px; }
.kop-rrow input[type="date"] { border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 6px; font: inherit; }
.kop-rrow input[type="checkbox"] { width: 16px; height: 16px; accent-color: #16a34a; cursor: pointer; }
.kop-rrow label { display: flex; align-items: center; gap: 4px; font-weight: 600; cursor: pointer; }
.lap-sec { border-top: 2px solid #111; padding: 10px 12px; }
.lap-sec-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.shift-box { border: 1px solid #9ca3af; border-radius: 8px; padding: 8px 12px; }
.shift-row { display: flex; align-items: center; gap: 18px; font-size: 14px; font-weight: 600; margin: 6px 0; }
.shift-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.shift-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: #16a34a; cursor: pointer; }
.placeholder {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 40px 48px;
    text-align: center;
    max-width: 560px;
}
.placeholder .mat {
    font-family: 'Material Symbols Outlined';
    font-size: 44px;
    color: #9ca3af;
}
.placeholder h1 { font-size: 22px; font-weight: 800; margin: 12px 0 6px; }
.placeholder p { font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
<div id="lapReport">
  <div class="kop">
    <div class="kop-left">
      <div>PT. Toyota Motor Mfg Indonesia</div>
      <div>Engine Production Sunter Division</div>
      <div>Casting Production</div>
    </div>
    <div class="kop-center">
      <div class="t1">INFORMASI ANTAR SHIFT</div>
      <div class="t2">LINE CORE MAKING</div>
    </div>
    <div class="kop-right">
      <div class="kop-rrow"><span class="kop-rlab">Hari :</span><span id="lapHari" style="min-height:1.2em"></span></div>
      <div class="kop-rrow"><span class="kop-rlab">Tanggal :</span><input type="date" id="lapTanggal"></div>
      <div class="kop-rrow"><span class="kop-rlab">PIC :</span>
        <label><input type="checkbox" class="pic-chk" value="Darno"> Darno,</label>
        <label><input type="checkbox" class="pic-chk" value="Sutarto"> Sutarto</label>
      </div>
    </div>
  </div>
  <div class="lap-sec">
    <div class="lap-sec-title">1.SHIFT</div>
    <div class="shift-box">
    <div class="shift-row">
      <label><input type="checkbox" class="shift-core" value="Red"> Red</label>
      <label><input type="checkbox" class="shift-core" value="White"> White</label>
    </div>
    <div class="shift-row">
      <label><input type="checkbox" class="shift-time" value="Day"> Day</label>
      <label><input type="checkbox" class="shift-time" value="Night"> Night</label>
    </div>
    </div>
  </div>
</div>
<script>
(function () {
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  function updateHari() {
    var inp = document.getElementById('lapTanggal');
    var out = document.getElementById('lapHari');
    if (!inp || !out) return;
    var p = String(inp.value || '').split('-');
    if (p.length !== 3 || !p[0]) { out.textContent = ''; return; }
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    out.textContent = isNaN(dt) ? '' : HARI[dt.getDay()];
  }
  var inp = document.getElementById('lapTanggal');
  if (inp) inp.addEventListener('change', updateHari);
  updateHari();
  document.querySelectorAll('.pic-chk').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) document.querySelectorAll('.pic-chk').forEach(function (o) { if (o !== el) o.checked = false; });
    });
  });
  document.querySelectorAll('.shift-core').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) document.querySelectorAll('.shift-core').forEach(function (o) { if (o !== el) o.checked = false; });
    });
  });
  document.querySelectorAll('.shift-time').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) document.querySelectorAll('.shift-time').forEach(function (o) { if (o !== el) o.checked = false; });
    });
  });
})();
</script>
<script src="guest-lock.js"></script>
</body>
</html>
