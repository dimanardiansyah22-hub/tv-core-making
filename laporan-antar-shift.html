<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>Laporan Antar Shift — Readiness Supply Core Making</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Hanken Grotesk', sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
    padding: 24px 12px;
}
#lapReport { margin: 0 auto; background: #fff; border: 1px solid #d1d5db; border-radius: 10px; overflow: hidden; }
.kop { display: flex; align-items: stretch; border-bottom: 2px solid #111; }
.kop-left { flex: 25; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.6; border-right: 1px solid #d1d5db; text-align: center; display: flex; flex-direction: column; justify-content: center; }
.kop-center { flex: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 12px; border-right: 1px solid #d1d5db; }
.kop-center .t1 { font-size: 28px; font-weight: 800; letter-spacing: .02em; }
.kop-center .t2 { font-size: 19px; font-weight: 800; margin-top: 5px; }
.kop-right { flex: 25; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 9px; justify-content: center; }
.kop-rrow { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.kop-rlab { min-width: 64px; }
.kop-rrow input[type="text"] { border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 6px; font: inherit; }
.kop-rrow input[type="checkbox"] { width: 16px; height: 16px; accent-color: #16a34a; cursor: pointer; }
.kop-rrow label { display: flex; align-items: center; gap: 4px; font-weight: 600; cursor: pointer; }
.lap-sec { padding: 10px 12px; }
.lap-sec-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.shift-box { border: 1px solid #9ca3af; border-radius: 8px; padding: 10px 14px; width: 20%; }
.shift-row { display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 15px; font-weight: 600; margin: 8px 0; text-align: center; }
.shift-row:first-child { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px dashed #d1d5db; }
.shift-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.shift-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #16a34a; cursor: pointer; }
.absen-box { border: 1px solid #9ca3af; border-radius: 8px; padding: 10px 14px; width: 25%; box-sizing: border-box; overflow: hidden; }
.absen-row { display: flex; align-items: center; gap: 5px; margin: 7px 0; font-size: 14px; font-weight: 600; flex-wrap: nowrap; }
.absen-lab { flex: none; width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.absen-sub { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin: 12px 0 2px; }
.absen-in { flex: none; width: 130px; max-width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 5px 8px; font: inherit; background: #fff; color: inherit; box-sizing: border-box; }
body.night .absen-box { border-color: #777; }
body.night .absen-sub { color: #b0b0d0; }
body.night .absen-in { background: #2d2d44; color: #f5f5ff; border-color: #555; }
/* Tema malam (versi Night) — selaras dark-mode Visualisasi WIP Core */
body.night { background: #2d2d44; color: #e8e8f0; }
body.night #lapReport { background: #383855; border-color: #555; }
body.night .kop { border-bottom-color: #e8e8f0; }
body.night .kop-left, body.night .kop-center { border-right-color: #777; }
body.night .kop-right input[type="text"] { background: #2d2d44; color: #f5f5ff; border-color: #555; }
body.night .shift-box { border-color: #777; }
body.night .shift-row:first-child { border-bottom-color: #777; }
.placeholder {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 40px 48px;
    text-align: center;
    max-width: 560px;
}
.placeholder .mat {
    font-family: 'Material Symbols Outlined';
    font-size: 44px;
    color: #9ca3af;
}
.placeholder h1 { font-size: 22px; font-weight: 800; margin: 12px 0 6px; }
.placeholder p { font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
<div id="lapReport">
  <div class="kop">
    <div class="kop-left">
      <div>PT. Toyota Motor Mfg Indonesia</div>
      <div>Engine Production Sunter Division</div>
      <div>Casting Production</div>
    </div>
    <div class="kop-center">
      <div class="t1">INFORMASI ANTAR SHIFT</div>
      <div class="t2">LINE CORE MAKING</div>
    </div>
    <div class="kop-right">
      <div class="kop-rrow"><span class="kop-rlab">Hari :</span><span id="lapHari" style="min-height:1.2em"></span></div>
      <div class="kop-rrow"><span class="kop-rlab">Tanggal :</span><input type="text" id="lapTanggal" placeholder="DD-MM-YYYY" inputmode="numeric"></div>
      <div class="kop-rrow"><span class="kop-rlab">PIC :</span>
        <label><input type="checkbox" class="pic-chk" value="Darno"> Darno,</label>
        <label><input type="checkbox" class="pic-chk" value="Sutarto"> Sutarto</label>
      </div>
    </div>
  </div>
  <div class="lap-sec">
    <div class="lap-sec-title">1.SHIFT</div>
    <div class="shift-box">
    <div class="shift-row">
      <label><input type="checkbox" class="shift-core" value="Red"> Red</label>
      <label><input type="checkbox" class="shift-core" value="White"> White</label>
    </div>
    <div class="shift-row">
      <label><input type="checkbox" class="shift-time" value="Day"> Day</label>
      <label><input type="checkbox" class="shift-time" value="Night"> Night</label>
    </div>
    </div>
  </div>
  <div class="lap-sec">
    <div class="lap-sec-title">2.ABSENSI</div>
    <div class="absen-box">
      <div class="absen-row"><span class="absen-lab">M/P</span><input class="absen-in" data-k="mp" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">Absen</span><input class="absen-in" data-k="absen" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">% Kehadiran</span><input class="absen-in" data-k="kehadiran" autocomplete="off" inputmode="decimal" readonly title="Otomatis: (M/P − Absen) ÷ M/P"></div>
      <div class="absen-sub">Keterangan</div>
      <div class="absen-row"><span class="absen-lab">Cuti</span><input class="absen-in" data-k="cuti" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">Sakit</span><input class="absen-in" data-k="sakit" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">Izin</span><input class="absen-in" data-k="izin" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">TD</span><input class="absen-in" data-k="td" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">PC</span><input class="absen-in" data-k="pc" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">Training</span><input class="absen-in" data-k="training" autocomplete="off"></div>
      <div class="absen-row"><span class="absen-lab">Lain-lain</span><input class="absen-in" data-k="lain" autocomplete="off"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  function parseTanggal(str) {
    var m = String(str || '').match(/^(\d{2})-(\d{2})-(\d{4})$/);
    if (m) return { y: +m[3], m: +m[2], d: +m[1] };
    m = String(str || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    return null;
  }
  function updateHari() {
    var inp = document.getElementById('lapTanggal');
    var out = document.getElementById('lapHari');
    if (!inp || !out) return;
    var p = parseTanggal(inp.value);
    if (!p) { out.textContent = ''; return; }
    var dt = new Date(p.y, p.m - 1, p.d);
    out.textContent = isNaN(dt) ? '' : HARI[dt.getDay()];
  }
  var inp = document.getElementById('lapTanggal');
  if (inp) inp.addEventListener('change', updateHari);
  updateHari();
  function parseNum(str) {
    var v = parseFloat(String(str || '').replace(',', '.'));
    return isNaN(v) ? 0 : v;
  }
  function updateKehadiran() {
    var mpEl = document.querySelector('.absen-in[data-k="mp"]');
    var abEl = document.querySelector('.absen-in[data-k="absen"]');
    var out = document.querySelector('.absen-in[data-k="kehadiran"]');
    if (!mpEl || !abEl || !out) return;
    var mp = parseNum(mpEl.value), ab = parseNum(abEl.value);
    if (mp <= 0) { out.value = ''; return; }
    var pct = (mp - ab) / mp * 100;
    out.value = (Math.round(pct * 10) / 10).toString().replace('.', ',') + '%';
  }
  document.querySelectorAll('.absen-in[data-k="mp"], .absen-in[data-k="absen"]').forEach(function (el) {
    el.addEventListener('input', updateKehadiran);
  });
  updateKehadiran();
  document.querySelectorAll('.pic-chk').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) document.querySelectorAll('.pic-chk').forEach(function (o) { if (o !== el) o.checked = false; });
    });
  });
  document.querySelectorAll('.shift-core').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) document.querySelectorAll('.shift-core').forEach(function (o) { if (o !== el) o.checked = false; });
    });
  });
  document.querySelectorAll('.shift-time').forEach(function (el) {
    el.addEventListener('change', function () {
      if (el.checked) {
        document.querySelectorAll('.shift-time').forEach(function (o) { if (o !== el) o.checked = false; });
        document.body.classList.toggle('night', el.value === 'Night');
      } else {
        document.body.classList.remove('night');
      }
      var next = lapStore();
      if (next !== lapActiveStore) {
        saveLapDataTo(lapActiveStore, lapActiveStore === 'night' ? 'Night' : 'Day');
        lapActiveStore = next;
        loadSavedLap();
        lapSyncFromServer();
      }
    });
  });

  /* ── Sinkron Drive per shift Day/Night (pola = Visualisasi WIP Core) ──
     Isi/hapus apa pun tersimpan lokal seketika + terdorong ke Drive (±800ms).
     Last-write-wins berbasis waktu; server kosong tak menghapus; anti-campur shift. */
  var lapActiveStore = 'day';
  var LAP_SKEW_MS = 120000;
  var _lapSaveTimer = {};
  var _lapPendingSave = {};
  var _lapLastTs = {};
  var _lapDirty = {};
  var _lapDeleted = {};
  var _lapCleared = {};
  var _lapSyncedOnce = {};
  function isLapGuest() {
    try {
      if (new URLSearchParams(window.location.search).get('role') === 'guest') return true;
    } catch (e) {}
    try {
      var ps = window.parent && window.parent.tvcSession && window.parent.tvcSession();
      if (ps && ps.role === 'guest') return true;
    } catch (e) {}
    return false;
  }
  function lapStore() {
    var n = document.querySelector('.shift-time:checked');
    return (n && n.value === 'Night') ? 'night' : 'day';
  }
  function lapKey(store) { return 'lap-data-' + store; }
  function lapGetLastTs(store) {
    if (_lapLastTs[store] === undefined) {
      try { _lapLastTs[store] = localStorage.getItem('lap-lasts-' + store) || null; } catch (e) { _lapLastTs[store] = null; }
    }
    return _lapLastTs[store];
  }
  function lapSetLastTs(store, ts) {
    _lapLastTs[store] = ts;
    try { localStorage.setItem('lap-lasts-' + store, ts); } catch (e) {}
  }
  function lapGetSyncedAt(store) {
    try { return Number(localStorage.getItem('lap-synced-' + store)) || 0; } catch (e) { return 0; }
  }
  function lapSetSyncedAt(store, t) {
    try { localStorage.setItem('lap-synced-' + store, String(t)); } catch (e) {}
  }
  function collectLapData() {
    var data = {};
    var t = document.getElementById('lapTanggal');
    data.tanggal = t ? t.value : '';
    function chk(cls) {
      var el = document.querySelector('.' + cls + ':checked');
      return el ? el.value : '';
    }
    data.pic = chk('pic-chk');
    data.shiftCore = chk('shift-core');
    data.shiftTime = chk('shift-time');
    document.querySelectorAll('.absen-in').forEach(function (el) {
      if (el.dataset.k) data[el.dataset.k] = el.value;
    });
    return data;
  }
  function setLapCheck(cls, val) {
    document.querySelectorAll('.' + cls).forEach(function (el) {
      if (el === document.activeElement) return;
      el.checked = (val !== undefined && val !== '' && el.value === val);
    });
  }
  function applyLapData(data) {
    data = data || {};
    var focusEl = document.activeElement;
    var el = document.getElementById('lapTanggal');
    if (el && el !== focusEl && data.tanggal !== undefined && data.tanggal !== '') el.value = data.tanggal;
    setLapCheck('pic-chk', data.pic);
    setLapCheck('shift-core', data.shiftCore);
    if (data.shiftTime !== undefined && data.shiftTime !== '') {
      setLapCheck('shift-time', data.shiftTime);
      document.body.classList.toggle('night', data.shiftTime === 'Night');
    }
    var cleared = _lapCleared[lapActiveStore] || {};
    document.querySelectorAll('.absen-in').forEach(function (e2) {
      if (e2 === focusEl) return;
      var k = e2.dataset.k;
      if (!k) return;
      var v = data[k];
      if (v !== undefined && v !== '') e2.value = v;
      else if (cleared[k]) e2.value = '';
    });
    updateHari();
    updateKehadiran();
  }
  function loadSavedLap() {
    var raw = null;
    try { raw = localStorage.getItem(lapKey(lapActiveStore)); } catch (e) {}
    var data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch (e) { data = {}; }
    applyLapData(data);
  }
  function saveLapDataTo(store, shiftTimeOverride) {
    var snapshot = collectLapData();
    if (shiftTimeOverride) snapshot.shiftTime = shiftTimeOverride;
    var key = lapKey(store);
    var prev = {};
    try { prev = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { prev = {}; }
    localStorage.setItem(key, JSON.stringify(snapshot));
    if (isLapGuest()) return;
    if (!_lapDirty[store]) _lapDirty[store] = {};
    var now = Date.now(), changed = false;
    Object.keys(snapshot).forEach(function (k) {
      var pv = (prev[k] === undefined) ? '' : prev[k];
      if (snapshot[k] !== pv) {
        _lapDirty[store][k] = now; changed = true;
        if (snapshot[k] === '' && pv !== '') {
          if (!_lapDeleted[store]) _lapDeleted[store] = {};
          _lapDeleted[store][k] = now;
        } else if (snapshot[k] !== '') {
          if (_lapDeleted[store]) delete _lapDeleted[store][k];
        }
      }
    });
    try {
      if (_lapDeleted[store] && Object.keys(_lapDeleted[store]).length) localStorage.setItem('lap-del-' + store, JSON.stringify(_lapDeleted[store]));
      else localStorage.removeItem('lap-del-' + store);
    } catch (e) {}
    if (!changed && !Object.keys(_lapDirty[store]).length) return;
    if (changed) { try { localStorage.setItem('lap-ts2-' + store, String(now)); } catch (e) {} }
    scheduleLapSave(store);
  }
  function saveLapData() { saveLapDataTo(lapActiveStore); }
  function scheduleLapSave(store) {
    store = store || lapActiveStore;
    if (isLapGuest()) return;
    if (!window.Sync || !Sync.hasUrl()) return;
    if (!_lapSyncedOnce[store]) return;
    if (!_lapDeleted[store]) { try { _lapDeleted[store] = JSON.parse(localStorage.getItem('lap-del-' + store) || '{}') || {}; } catch (e) { _lapDeleted[store] = {}; } }
    _lapPendingSave[store] = true;
    clearTimeout(_lapSaveTimer[store]);
    var snapshot = { store: store, data: collectLapData() };
    if (store !== lapActiveStore) snapshot.data.shiftTime = (store === 'night' ? 'Night' : 'Day');
    if (_lapDeleted[store] && Object.keys(_lapDeleted[store]).length) {
      snapshot.data._deleted = Object.assign({}, _lapDeleted[store]);
    }
    _lapSaveTimer[store] = setTimeout(function () { syncLapSave(snapshot); }, 800);
  }
  async function syncLapSave(snapshot) {
    if (isLapGuest()) return;
    if (!window.Sync || !Sync.hasUrl()) return;
    try {
      const timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Kirim timeout')); }, 25000); });
      const res = await Promise.race([Sync.save('lapshift', { shift: snapshot.store, action: 'save', data: snapshot.data }), timeout]);
      if (!res || !res.ok) throw new Error((res && res.error) || 'Server menolak');
      if (res.updatedAt) lapSetLastTs(snapshot.store, res.updatedAt);
      lapSetSyncedAt(snapshot.store, Date.now());
      if (snapshot.data && snapshot.data._deleted) {
        Object.keys(snapshot.data._deleted).forEach(function (k) { if (_lapDeleted[snapshot.store]) delete _lapDeleted[snapshot.store][k]; });
      }
      try {
        var dm = _lapDeleted[snapshot.store];
        if (dm && Object.keys(dm).length) localStorage.setItem('lap-del-' + snapshot.store, JSON.stringify(dm));
        else localStorage.removeItem('lap-del-' + snapshot.store);
      } catch (e) {}
      _lapDirty[snapshot.store] = {};
      _lapPendingSave[snapshot.store] = false;
    } catch (e) {
      _lapPendingSave[snapshot.store] = false;
    }
  }
  function mergeLapData(store, server) {
    var local = {};
    try { local = JSON.parse(localStorage.getItem(lapKey(store)) || '{}'); } catch (e) { local = {}; }
    var dirty = _lapDirty[store] || {};
    var localTs = 0;
    try { localTs = Number(localStorage.getItem('lap-ts2-' + store)) || 0; } catch (e) {}
    var serverTs = 0;
    try { serverTs = new Date(server.updatedAt).getTime() || 0; } catch (e) {}
    var guest = isLapGuest();
    var merged = Object.assign({}, local);
    _lapCleared[store] = {};
    var delMap = (server._deleted && typeof server._deleted === 'object') ? server._deleted : {};
    Object.keys(server).forEach(function (k) {
      if (k === 'updatedAt' || k === '_deleted') return;
      var sv = server[k];
      var lv = local[k];
      if (!guest && dirty[k] && (dirty[k] + LAP_SKEW_MS) > serverTs) return;
      if (sv === undefined || sv === '') {
        if (!guest && delMap[k] === undefined && lv !== undefined && lv !== '') {
          if (!_lapDirty[store]) _lapDirty[store] = {};
          _lapDirty[store][k] = Date.now();
        }
        return;
      }
      if (!guest && (lv !== undefined && lv !== '') && (dirty[k] || localTs > serverTs)) {
        if (!_lapDirty[store]) _lapDirty[store] = {};
        _lapDirty[store][k] = Math.max(dirty[k] || 0, localTs);
        return;
      }
      merged[k] = sv;
    });
    Object.keys(delMap).forEach(function (k) {
      var dts = Number(delMap[k]) || 0;
      var lv = local[k];
      if (lv === undefined || lv === '') return;
      if (guest) { merged[k] = ''; _lapCleared[store][k] = true; return; }
      var localTime = Math.max(dirty[k] || 0, 0);
      if (dts > localTime) { merged[k] = ''; _lapCleared[store][k] = true; }
    });
    return merged;
  }
  async function lapSyncFromServer() {
    if (!window.Sync || !Sync.hasUrl()) return;
    var store = lapActiveStore;
    if (_lapPendingSave[store]) return;
    if (!_lapDeleted[store]) { try { _lapDeleted[store] = JSON.parse(localStorage.getItem('lap-del-' + store) || '{}') || {}; } catch (e) { _lapDeleted[store] = {}; } }
    try {
      const res = await Sync.get('lapshift', { shift: store, action: 'get' });
      if (lapActiveStore !== store) return;
      if (res && res.ok) _lapSyncedOnce[store] = true;
      const data = (res && res.ok && res.data) ? res.data : null;
      const needPush = () => Object.keys(_lapDirty[store] || {}).length || Object.keys(_lapDeleted[store] || {}).length;
      if (!data || !data.updatedAt) { if (needPush()) scheduleLapSave(store); return; }
      if (data.updatedAt === lapGetLastTs(store)) {
        let localTs = 0;
        try { localTs = Number(localStorage.getItem('lap-ts2-' + store)) || 0; } catch (e) {}
        if (localTs > lapGetSyncedAt(store)) scheduleLapSave(store);
        return;
      }
      lapSetLastTs(store, data.updatedAt);
      const values = mergeLapData(store, data);
      try { localStorage.setItem(lapKey(store), JSON.stringify(values)); } catch (e) {}
      applyLapData(values);
      if (needPush()) scheduleLapSave(store);
    } catch (e) {}
  }
  /* binding simpan: semua isian + checkbox */
  document.getElementById('lapTanggal').addEventListener('input', function () { saveLapData(); });
  document.getElementById('lapTanggal').addEventListener('change', function () { saveLapData(); });
  document.querySelectorAll('.absen-in').forEach(function (el) {
    el.addEventListener('input', function () { saveLapData(); });
  });
  document.querySelectorAll('.pic-chk, .shift-core, .shift-time').forEach(function (el) {
    el.addEventListener('change', function () { saveLapData(); });
  });
  /* init */
  lapActiveStore = lapStore();
  loadSavedLap();
  if (document.querySelector('.shift-time:checked')) {
    document.body.classList.toggle('night', document.querySelector('.shift-time:checked').value === 'Night');
  }
  lapSyncFromServer();
  if (window.Sync) setInterval(lapSyncFromServer, Sync.pollMs);
})();
</script>
<script src="sync-core.js"></script>
<script src="guest-lock.js"></script>
</body>
</html>
