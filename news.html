<!DOCTYPE html>
<html lang="id" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>News — TV Core Making</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
    (function () {
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    })();
</script>
<style>
    :root {
        --background: #f9f9f9;
        --surface: #f9f9f9;
        --surface-container-lowest: #ffffff;
        --surface-container-low: #f3f3f3;
        --surface-container: #eeeeee;
        --surface-container-high: #e8e8e8;
        --outline-variant: #e9bcb7;
        --outline: #936e6a;
        --on-surface: #1a1c1c;
        --on-surface-variant: #5e3f3b;
        --secondary: #5f5e5e;
        --primary: #bd0014;
        --on-primary: #ffffff;
        --primary-soft: rgba(189, 0, 20, 0.08);
        --shadow: rgba(0, 0, 0, 0.10);
    }
    html.dark {
        --background: #0b0d14;
        --surface: #101219;
        --surface-container-lowest: #06080d;
        --surface-container-low: #13151d;
        --surface-container: #171922;
        --surface-container-high: #222436;
        --outline-variant: #404354;
        --outline: #8e92a0;
        --on-surface: #e4e4ec;
        --on-surface-variant: #c4c6d0;
        --secondary: #bcc7d4;
        --primary: #4a8cff;
        --on-primary: #ffffff;
        --primary-soft: rgba(74, 140, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
        margin: 0;
        background: var(--background);
        color: var(--on-surface);
        font-family: "Inter", system-ui, sans-serif;
        padding: 26px 24px 48px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }
    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    .eyebrow .material-symbols-outlined { font-size: 18px; }
    h1 {
        margin: 0;
        font-family: "Hanken Grotesk", sans-serif;
        font-size: clamp(26px, 3vw, 38px);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -.02em;
    }
    .subtitle {
        margin: 8px 0 0;
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.6;
        max-width: 620px;
    }
    .count {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 999px;
        background: var(--surface-container-low);
        border: 1px solid var(--outline-variant);
        color: var(--secondary);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }
    .count b { color: var(--on-surface); font-family: "JetBrains Mono", monospace; }
    .ticker-preview {
        display: none;
        align-items: stretch;
        height: 42px;
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        box-shadow: 0 6px 22px var(--shadow);
        margin-bottom: 20px;
    }
    .ticker-preview.on { display: flex; }
    .ticker-preview .label {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        background: var(--primary);
        color: var(--on-primary);
        font-family: "Hanken Grotesk", sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
    }
    .ticker-preview .label .material-symbols-outlined { font-size: 17px; }
    .ticker-preview .viewport { flex: 1; overflow: hidden; position: relative; }
    .ticker-preview .track {
        display: inline-flex;
        align-items: center;
        height: 100%;
        white-space: nowrap;
        will-change: transform;
        animation: news-scroll var(--dur, 26s) linear infinite;
    }
    .ticker-preview:hover .track { animation-play-state: paused; }
    .ticker-preview .item {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0 26px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--on-surface);
    }
    .ticker-preview .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--primary);
        flex: 0 0 auto;
    }
    @keyframes news-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }
    .news-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
    }
    .card {
        position: relative;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        border-radius: 14px;
        padding: 20px 20px 18px 22px;
        box-shadow: 0 8px 24px var(--shadow);
        overflow: hidden;
    }
    .card::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: var(--primary);
        opacity: .85;
    }
    .card-top {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }
    .tag {
        display: inline-flex;
        align-items: center;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
    }
    .date {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--secondary);
        font-size: 11.5px;
        font-weight: 600;
    }
    .date .material-symbols-outlined { font-size: 14px; }
    .card h2 {
        margin: 0 0 8px;
        font-family: "Hanken Grotesk", sans-serif;
        font-size: 18px;
        line-height: 1.28;
        font-weight: 800;
        letter-spacing: -.01em;
    }
    .card p {
        margin: 0;
        color: var(--on-surface-variant);
        font-size: 13.5px;
        line-height: 1.65;
        white-space: pre-line;
    }
    .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 8px;
        padding: 64px 24px;
        border: 1px dashed var(--outline-variant);
        border-radius: 16px;
        background: var(--surface-container-lowest);
        color: var(--secondary);
    }
    .empty .material-symbols-outlined {
        font-size: 46px;
        color: var(--primary);
        opacity: .8;
    }
    .empty strong {
        color: var(--on-surface);
        font-family: "Hanken Grotesk", sans-serif;
        font-size: 17px;
    }
    .empty span { font-size: 13.5px; max-width: 460px; line-height: 1.6; }
    @media (max-width: 640px) {
        body { padding: 20px 16px 36px; }
        .news-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <div>
            <div class="eyebrow"><span class="material-symbols-outlined">campaign</span> News &amp; Information</div>
            <h1>News Core Making</h1>
            <p class="subtitle">Informasi terbaru seputar aktivitas dan pengumuman Core Making. Berita terbaru juga tampil sebagai running text di halaman utama.</p>
        </div>
        <div class="count"><span class="material-symbols-outlined" style="font-size:16px">feed</span> <b id="newsCount">0</b> berita</div>
    </div>

    <div class="ticker-preview" id="tickerPreview">
        <div class="label"><span class="material-symbols-outlined">campaign</span> News</div>
        <div class="viewport"><div class="track" id="tickerTrack"></div></div>
    </div>

    <div class="news-grid" id="newsGrid"></div>
</div>

<script src="news-data.js"></script>
<script>
(function () {
    'use strict';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function fmtDate(v) {
        if (!v) return '';
        var d = new Date(String(v) + 'T00:00:00');
        if (isNaN(d.getTime())) return String(v);
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function tickerText(n) {
        return n.ticker || n.text || n.title || '';
    }

    var items = (Array.isArray(window.TVC_NEWS) ? window.TVC_NEWS : []).filter(function (n) {
        return n && (n.title || n.text || n.ticker);
    });

    document.getElementById('newsCount').textContent = items.length;

    if (!items.length) {
        document.getElementById('newsGrid').innerHTML =
            '<div class="empty">' +
                '<span class="material-symbols-outlined">newspaper</span>' +
                '<strong>Belum ada berita</strong>' +
                '<span>Konten News akan tampil di sini dan berjalan sebagai running text di halaman utama.</span>' +
            '</div>';
        return;
    }

    document.getElementById('newsGrid').innerHTML = items.map(function (n) {
        var tag = n.tag ? '<span class="tag">' + esc(n.tag) + '</span>' : '';
        var date = n.date ? '<span class="date"><span class="material-symbols-outlined">event</span>' + esc(fmtDate(n.date)) + '</span>' : '';
        var title = n.title ? '<h2>' + esc(n.title) + '</h2>' : '';
        var text = n.text ? '<p>' + esc(n.text) + '</p>' : '';
        return '<article class="card">' +
            '<div class="card-top">' + tag + date + '</div>' +
            title + text +
        '</article>';
    }).join('');

    var preview = document.getElementById('tickerPreview');
    var track = document.getElementById('tickerTrack');
    var one = items.map(function (n) {
        return '<span class="item"><span class="dot"></span>' + esc(tickerText(n)) + '</span>';
    }).join('');

    var buildTries = 0;
    function buildTicker() {
        preview.classList.add('on');
        track.innerHTML = one;
        var viewport = track.parentElement.clientWidth || 800;
        var oneWidth = track.scrollWidth || 0;
        if (!oneWidth && buildTries++ < 10) {
            requestAnimationFrame(buildTicker);
            return;
        }
        if (!oneWidth) return;
        var copies = Math.max(1, Math.min(12, Math.ceil((viewport * 2) / oneWidth)));
        var full = one.repeat(copies);
        track.innerHTML = full + full;
        var cycleWidth = oneWidth * copies;
        track.style.setProperty('--dur', Math.max(18, Math.round(cycleWidth / 80)) + 's');
    }

    buildTicker();
    var t;
    window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(buildTicker, 180);
    });
})();
</script>
</body>
</html>
